name: Simulateur IoT

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installe les dependances
        working-directory: simulator
        run: pip install -r requirements.txt

      - name: Lance plusieurs cycles du simulateur
        working-directory: simulator
        env:
          API_URL: ${{ secrets.SIMULATOR_API_URL }}
          SIMULATOR_API_KEY: ${{ secrets.SIMULATOR_API_KEY }}
          NB_CYCLES: "20"
          INTERVALLE_SECONDES: "30"
        run: python -m app.main